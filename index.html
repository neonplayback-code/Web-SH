    <!-- Modo (astra | overdrive = HANGAR) y ambiente, antes del primer pintado para evitar parpadeos. -->
    <script>
      (function () {
        var d = document.documentElement;
        var mode = 'astra', theme = 'ice';
        try {
          var m = localStorage.getItem('od-uimode');
          if (['astra', 'overdrive'].indexOf(m) >= 0) mode = m;
          var t = localStorage.getItem('od-theme');
          if (['ice', 'toxic', 'ember', 'violet', 'white'].indexOf(t) >= 0) theme = t;
        } catch (e) {}
        d.dataset.mode = mode;
        d.dataset.theme = theme;
        d.dataset.quality = 'medium';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;700;800&family=Unbounded:wght@400;600;800&family=Sora:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@300..800&family=Oxanium:wght@400..800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet" />
    <script>
      // Restaura la ruta si GitHub Pages redirigió desde 404.html.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script src="%BASE_URL%ext/starrynight.js" defer></script>
